[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "djresource"
version = "0.1.0"
description = "Bibliothèque Django : génère automatiquement les vues CRUD, formulaires et routes d'un modèle."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enock Lankonadé", email = "lankoandeenock002@gmail.com" }]
keywords = [
    "django",
    "crud",
    "bibliothèque",
    "resource",
    "scaffolding",
    "views",
    "forms",
    "models",
    "bootstrap",
    "tailwind",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/NockiProgramTECH/djresource"
Documentation = "https://nockiprogramtech.github.io/djresource/"
Source = "https://github.com/NockiProgramTECH/djresource"
Issues = "https://github.com/NockiProgramTECH/djresource/issues"
Changelog = "https://nockiprogramtech.github.io/djresource/changelog/"

[project.optional-dependencies]
api = ["djangorestframework>=3.15"]
test = [
    "pytest>=7",
    "pytest-django>=4",
]

[tool.setuptools.packages.find]
include = ["djresource*"]

[tool.setuptools.package-data]
djresource = ["templates/**/*.html", "static/**/*"]
