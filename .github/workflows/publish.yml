name: Publier sur PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Tests avant publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install "Django>=4.2"

      - name: Lancer les tests
        run: python runtests.py

  build:
    name: Construire et valider les distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils de build
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Vérifier la cohérence version / tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag: $TAG_VERSION — pyproject.toml: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version déclarée dans pyproject.toml ($PYPROJECT_VERSION)."
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Construire les distributions
        run: python -m build

      - name: Valider les distributions (twine check --strict)
        run: twine check --strict dist/*

      - name: Conserver les distributions pour le job de publication
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publier sur PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/djresource/
    steps:
      - name: Récupérer les distributions validées
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
