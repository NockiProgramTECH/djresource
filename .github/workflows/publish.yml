name: Publier sur PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/djresource/
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils de build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Construire les distributions
        run: python -m build

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
