{% load djresource_tags %}
<table class="min-w-full bg-white rounded shadow divide-y divide-gray-100">
    <tbody>
    {% for field in object|get_fields_display %}
    <tr>
        <th class="px-4 py-2 text-left text-sm font-medium text-gray-500 w-1/3">{{ field.label|capfirst }}</th>
        <td class="px-4 py-2 text-sm text-gray-800">{{ field.value }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
