<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DjResource{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="bg-gray-900 text-white px-6 py-4 mb-6">
    <span class="text-lg font-semibold">DjResource</span>
</nav>

<div class="max-w-5xl mx-auto px-4 pb-12">
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 rounded px-4 py-3
                {% if message.tags == 'success' %}bg-green-100 text-green-800
                {% elif message.tags == 'error' or message.tags == 'danger' %}bg-red-100 text-red-800
                {% else %}bg-blue-100 text-blue-800{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
