site_name: DjResource
site_description: "Django library: automatically generate CRUD views, forms and routes for a model."
site_author: Enock Lankonadé
site_url: https://nockiprogramtech.github.io/djresource/
repo_url: https://github.com/NockiProgramTECH/djresource

copyright: "Copyright &copy; 2026 Enock Lankonadé — MIT License"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NockiProgramTECH/djresource
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [djresource]
          options:
            show_source: true
            show_root_heading: false
            show_category_heading: false
            heading_level: 3
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          nav:
            - Home: index.md
            - Guide:
                - Installation: guide/installation.md
                - Quickstart: guide/quickstart.md
                - Themes: guide/themes.md
                - Customization: guide/customization.md
                - Advanced features: guide/advanced.md
            - API reference:
                - Resource class: api/resource.md
                - Mixins: api/mixins.md
                - Tags and filters: api/templatetags.md
            - Contributing: contributing.md
            - Changelog: changelog.md
        - locale: fr
          name: Français
          nav:
            - Accueil: index.md
            - Guide:
                - Installation: guide/installation.md
                - Démarrage rapide: guide/quickstart.md
                - Thèmes: guide/themes.md
                - Personnalisation: guide/customization.md
                - Fonctionnalités avancées: guide/advanced.md
            - Référence API:
                - Classe Resource: api/resource.md
                - Mixins: api/mixins.md
                - Balises et filtres: api/templatetags.md
            - Contribuer: contributing.md
            - Journal des versions: changelog.md
